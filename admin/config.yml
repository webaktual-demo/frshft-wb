backend:
  name: github
  repo: webaktual-demo/frshft-wb
  branch: main

media_folder: "images/gallery"
public_folder: "/images/gallery"

collections:
  - name: "settings"
    label: "⚙️ Nastavenia webu"
    files:
      - name: "main"
        label: "Hlavné nastavenia"
        file: "data/settings.json"
        format: json
        fields:
          - {label: "Hero – 1. riadok", name: hero_line1, widget: string}
          - {label: "Hero – 2. riadok (zelený)", name: hero_line2, widget: string}
          - {label: "Hero – podnadpis", name: hero_subtitle, widget: text}
          - {label: "Hodiny Po–Pia", name: hours_weekday, widget: string}
          - {label: "Hodiny So–Ne", name: hours_weekend, widget: string}
          - {label: "Telefón", name: phone, widget: string}
          - {label: "Email", name: email, widget: string}
          - {label: "Adresa", name: address, widget: string}
          - {label: "Google Maps URL", name: maps_url, widget: string}

      - name: "oznam"
        label: "📢 Aktuálny oznam"
        file: "data/oznam.json"
        format: json
        fields:
          - {label: "Zobraziť oznam", name: visible, widget: boolean, default: false}
          - {label: "Nadpis", name: title, widget: string, required: false}
          - {label: "Text", name: text, widget: text, required: false}
          - {label: "Dátum", name: date, widget: string, required: false, hint: "napr. 15. júna 2026"}
          - label: "Obrázok (voliteľný)"
            name: image
            widget: image
            required: false
            hint: "Voliteľné — ak nevyplníte, zobrazí sa predvolené pozadie FreshFit. Odporúčame .webp, šírka min. 1200px."

  - name: "pricing"
    label: "💰 Cenník"
    files:
      - name: "plans"
        label: "Permanentky"
        file: "data/pricing.json"
        format: json
        fields:
          - name: plans
            label: Permanentky
            widget: list
            fields:
              - {label: Názov, name: name, widget: string}
              - {label: "Cena (€)", name: price, widget: number}
              - {label: "Popis (krátky subtitle)", name: description, widget: string, required: false}
              - {label: "Odznak (napr. Zľava, Výhodná, Šetríte 57 €)", name: badge, widget: string, required: false}
              - {label: "Zvýraznená (BESTSELLER)", name: featured,
                 widget: boolean, default: false}

  - name: "poukazky"
    label: "🎁 Darčekové poukážky"
    files:
      - name: "main"
        label: "Poukážky"
        file: "data/poukazky.json"
        format: json
        fields:
          - name: items
            label: "Poukážky"
            label_singular: "Poukážka"
            widget: list
            fields:
              - {label: "Suma (€)", name: value, widget: string}
              - {label: "Čo to je", name: benefit, widget: string, hint: "napr. Mesačná permanentka"}
              - {label: "Pre koho", name: for, widget: string, hint: "napr. Klasická · neobmedzený vstup"}
              - {label: "Bestseller (zvýraznená + Bestseller odznak)", name: best, widget: boolean, default: false}

  - name: "treneri"
    label: "🏋️ Tréneri"
    files:
      - name: "main"
        label: "Tréneri"
        file: "data/treneri.json"
        format: json
        fields:
          - name: treneri
            label: "Tréneri"
            label_singular: "Tréner"
            widget: list
            fields:
              - {label: "Meno", name: meno, widget: string}
              - {label: "Rola", name: rola, widget: string, hint: "napr. Osobný tréner · Skupinové cvičenia"}
              - {label: "Foto", name: foto, widget: image}
              - {label: "Popis", name: popis, widget: text, required: false, hint: "Krátky popis špecializácie a prístupu."}
              - {label: "Telefón", name: telefon, widget: string, required: false}
              - {label: "Instagram (@)", name: instagram, widget: string, required: false, hint: "meno bez @, napr. freshfit.trener"}

  - name: "marquee"
    label: "🏃 Bežiaci pás (marquee)"
    files:
      - name: "main"
        label: "Bežiaci pás (marquee)"
        file: "data/marquee.json"
        format: json
        fields:
          - name: marquee1
            label: "Horný pás"
            label_singular: "Fráza"
            widget: list
            required: false
            hint: "Frázy horného bežiaceho pásu (nad oznamami). Prázdne = pôvodný text."
          - name: marquee2
            label: "Pás pod oznamami"
            label_singular: "Fráza"
            widget: list
            required: false
            hint: "Frázy spodného bežiaceho pásu (pod oznamami). Prázdne = pôvodný text."

  - name: "gallery"
    label: "🖼️ Galéria – Albumy"
    folder: "data/albums"
    format: json
    create: true
    slug: "{{slug}}"
    identifier_field: title
    fields:
      - {label: "Názov albumu", name: title, widget: string}
      - {label: Popis, name: description, widget: text, required: false}
      - {label: Dátum, name: date, widget: datetime,
         format: "YYYY-MM-DD", date_format: "DD.MM.YYYY", time_format: false}
      - {label: "Titulná fotka", name: cover, widget: image, required: false}
      - name: photos
        label: Fotky
        widget: list
        fields:
          - {label: Fotka, name: src, widget: image}
          - {label: "Popis (voliteľný)", name: caption,
             widget: string, required: false}
