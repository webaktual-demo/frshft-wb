<script>
  const nav = document.getElementById("nav");
  window.addEventListener("scroll", () => { nav.classList.toggle("scrolled", window.scrollY > 20); });
  const toggle = document.getElementById("navToggle");
  const menu = document.getElementById("navMenu");
  toggle.addEventListener("click", () => { toggle.classList.toggle("open"); menu.classList.toggle("open"); });
  menu.querySelectorAll("a:not(.nav-dropdown a)").forEach(a => a.addEventListener("click", () => {
    toggle.classList.remove("open"); menu.classList.remove("open");
  }));
  document.querySelectorAll(".nav-dropdown > a").forEach(a => {
    a.addEventListener("click", (e) => {
      if (window.innerWidth <= 768) {
        e.preventDefault();
        a.closest(".nav-dropdown").classList.toggle("open");
      }
    });
  });
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add("visible"); io.unobserve(e.target); } });
  }, { threshold: 0.12 });
  document.querySelectorAll(".reveal").forEach(el => io.observe(el));
  const backToTop = document.getElementById("backToTop");
  window.addEventListener("scroll", () => { backToTop.classList.toggle("visible", window.scrollY > 300); });
  backToTop.addEventListener("click", () => { window.scrollTo({ top: 0, behavior: "smooth" }); });
</script>
